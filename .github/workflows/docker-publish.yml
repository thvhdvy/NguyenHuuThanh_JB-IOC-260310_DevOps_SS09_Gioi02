name: Build and Push Docker Image

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # Stage 1: Build file .jar (Kế thừa từ bài trước)
  build:
    runs-on: ubuntu-latest
    container:
      image: gradle:7.6-jdk17

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Application (.jar) - Skip tests for faster packaging
        run: ./gradlew build -x test

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 1

  # Stage 2: Dockerize và Push lên Docker Hub (Chạy sau job build)
  dockerize:
    runs-on: ubuntu-latest
    needs: build
    
    # Sử dụng dịch vụ Docker-in-Docker để hỗ trợ lệnh docker build/push
    services:
      docker:
        image: docker:dind
        options: --privileged
        ports:
          - 2375:2375

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Tải file .jar đã được lưu ở job build trước đó vào thư mục build/libs/
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          IMAGE_NAME="${{ secrets.DOCKER_USERNAME }}/user-service:latest"
          
          echo "Building Docker image..."
          docker build -t $IMAGE_NAME .
          
          echo "Pushing Docker image to Docker Hub..."
          docker push $IMAGE_NAME